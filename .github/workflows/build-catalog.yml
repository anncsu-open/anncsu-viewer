name: Build Portolan Catalog

on:
  workflow_run:
    workflows: ["Update ANNCSU Data"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_upload:
        description: "Upload the catalog to R2 even when nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    # A failed data update must not publish a catalog describing stale data.
    # workflow_dispatch has no triggering run, so it always proceeds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # `updated` is read from the last commit that touched the parquet. The
      # depth-1 clone above has no history, so that lookup would return HEAD
      # and the catalog would change on every unrelated commit. Fetching the
      # history without blobs takes a few seconds: commits and trees only, the
      # files of HEAD are already in place. actions/checkout cannot do this
      # itself, because its LFS step needs the pointer blobs a blobless clone
      # lacks. The generator refuses a shallow clone anyway; this makes sure
      # it never sees one.
      - name: Fetch the commit history without blobs
        run: |
          git fetch --unshallow --filter=blob:none origin
          test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Generate the catalog
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run scripts/build_catalog.py

      # Local data scope: the release archive's assets are absolute URLs to
      # R2 and are never in the checkout (.gitignore keeps the ZIPs and raw
      # Parquet out). Every asset that is in the checkout is still verified
      # byte for byte. A full pass over the archive is a deliberate local run.
      - name: Validate the catalog
        run: |
          uv run --with 'rashid>=0.1.8,<0.2.0' \
            rashid check data/ --schema --data-scope local --all

      - name: Check for changes
        id: changes
        run: |
          git add data/catalog.json data/README.md data/AGENTS.md \
            data/indirizzi data/indirizzi-h3 data/rilasci data/en
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the catalog
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Portolan catalog"
          git push

      # The upload normally follows a change. `force_upload` lets a manual run
      # publish anyway, for example after a failed upload whose commit already
      # landed, when a re-run would otherwise see no change and skip it.
      - name: Install rclone
        if: steps.changes.outputs.changed == 'true' || inputs.force_upload == true
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Upload the catalog to Cloudflare R2
        if: steps.changes.outputs.changed == 'true' || inputs.force_upload == true
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACL: private
          # The token can write objects but not create buckets. Without this,
          # rclone answers a 404 on a new object by trying CreateBucket, which
          # fails with 403. Existing objects and directory syncs never hit it,
          # which is why the data workflow's overwrites always worked.
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          # Only the catalog. The data files are synced by the update workflow,
          # and a narrow scope keeps anything else out of a public bucket.
          rclone copy data/catalog.json r2:anncsu-data/ -P
          rclone copy data/README.md r2:anncsu-data/ -P
          rclone copy data/AGENTS.md r2:anncsu-data/ -P
          rclone sync data/indirizzi/ r2:anncsu-data/indirizzi/ -P
          rclone sync data/indirizzi-h3/ r2:anncsu-data/indirizzi-h3/ -P
          # The archive's metadata only: copy with a filter, never sync. The
          # ZIPs and raw Parquet already on the bucket are not in the checkout
          # and a sync would delete them. en/rilasci/ is all metadata and is
          # covered by the en/ sync below.
          rclone copy data/rilasci/ r2:anncsu-data/rilasci/ \
            --include "*.json" --include "*.md" -P
          rclone sync data/en/ r2:anncsu-data/en/ -P

      - name: Check the published catalog
        if: steps.changes.outputs.changed == 'true' || inputs.force_upload == true
        continue-on-error: true
        run: |
          # Reports on range requests and CORS at the host. A problem here is
          # a bucket configuration issue, not a defect in the metadata just
          # generated, so it does not fail the run. The byte checks stay local:
          # the live probe still reaches the archive's absolute URLs, but
          # without downloading gigabytes of ZIPs and raw Parquet.
          uv run --with 'rashid>=0.1.8,<0.2.0' \
            rashid check data/ --live --data-scope local --all \
            --live-base-url https://pub-1e760dc850cb4a5aa5f8afb77713f8cd.r2.dev
