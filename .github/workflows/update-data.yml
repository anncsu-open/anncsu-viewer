name: Update ANNCSU Data

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:
    inputs:
      force_stradario_failure:
        description: "Make the stradario step fail, to check that the civici and the catalog still run and the run turns red"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    # The stradario step has continue-on-error, so its conclusion is always
    # success. The outcome keeps the real result for the report job.
    outputs:
      stradario: ${{ steps.stradario.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install rclone (early, for live log shipping)
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      # The stradario goes first and on its own: archive, upload and commit
      # happen here, before the civici start, so a civici failure later in the
      # run (an exception, a runner killed during enrichment) cannot lose a
      # release the portal may replace. continue-on-error keeps a stradario
      # failure from stopping the civici; the report job turns the run red at
      # the end. One step for all three actions, so its outcome covers them.
      - name: Archive the stradario
        id: stradario
        continue-on-error: true
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          ANNCSU_FORCE_STRADARIO_FAILURE: ${{ inputs.force_stradario_failure && '1' || '' }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACL: private
          # The token cannot create buckets; stop rclone from trying to when it
          # uploads a new object (the _debug log never reached R2 because of it).
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          set -euo pipefail
          uv run scripts/update_data.py --stradario

          # Nothing changed means the portal has no new release: stop here.
          if [ -z "$(git status --porcelain data/stradario)" ]; then
            echo "Stradario already up to date"
            exit 0
          fi

          # Upload before the commit: the index must never point at files
          # that are not on R2. copy, never sync: the checkout holds only
          # this release, a sync would delete every earlier one.
          rclone copy data/stradario/ r2:anncsu-data/stradario/ \
            --include "*/*.zip" --include "*/*.parquet" -P

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stradario/releases.json
          git commit -m "Update ANNCSU stradario"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      # A failed parse or upload must not lose a release the portal will stop
      # serving.
      - name: Keep the stradario ZIP of a failed run
        if: steps.stradario.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: stradario-zip
          path: data/stradario/*/*.zip
          if-no-files-found: ignore
          retention-days: 90

      - name: Install tippecanoe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe

      - name: Run update script
        env:
          PYTHONUNBUFFERED: "1"
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACL: private
          # The token cannot create buckets; stop rclone from trying to when it
          # uploads a new object (the _debug log never reached R2 because of it).
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          LOG=/tmp/update_data.log

          # Background heartbeat: prints memory + disk + load every 15s.
          # Goal: when the runner dies mid-run (logs are usually lost), see
          # the last heartbeat to confirm whether it was OOM, disk-full, or
          # a stalled silent stage.
          (
            while true; do
              ts=$(date +%H:%M:%S)
              mem=$(free -m | awk '/^Mem:/{printf "mem used=%dMi avail=%dMi (%.0f%% used of %dMi)", $3, $7, ($3*100)/$2, $2}')
              disk=$(df -h /home/runner/work | awk 'NR==2 {printf "disk used=%s avail=%s", $3, $4}')
              load=$(uptime | sed 's/.*load average://')
              echo "[$ts] [$mem] [$disk] [load=$load]"
              sleep 15
            done
          ) &
          MON_PID=$!

          # External live log shipper: ships /tmp/update_data.log to R2 every
          # 30s. Survives even if the runner is killed entirely (artifact
          # upload step wouldn't run in that case), so we can post-mortem
          # by fetching the file from R2.
          (
            while sleep 30; do
              [ -f "$LOG" ] && rclone copyto "$LOG" \
                "r2:anncsu-data/_debug/update_data-${{ github.run_id }}.log" \
                --no-traverse 2>/dev/null || true
            done
          ) &
          SHIP_PID=$!

          # Tee stdout/stderr to a workspace file so both the artifact upload
          # and the R2 shipper can preserve the log even if the script fails.
          set +e
          stdbuf -oL -eL uv run scripts/update_data.py 2>&1 | tee "$LOG"
          EXIT=${PIPESTATUS[0]}

          kill "$MON_PID" "$SHIP_PID" 2>/dev/null || true

          echo "=== FINAL STATE ==="
          free -m
          df -h /home/runner/work
          ps -ax -o pid,rss,vsz,comm | sort -k 2 -rn | head -5

          # Final ship of the complete log
          rclone copyto "$LOG" \
            "r2:anncsu-data/_debug/update_data-${{ github.run_id }}.log" \
            --no-traverse 2>/dev/null || true

          exit "$EXIT"

      - name: Upload script logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-data-log
          path: /tmp/update_data.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Check for changes
        id: changes
        run: |
          # The stradario has its own step and commit. If that step failed
          # after archiving but before uploading, its index must not ride
          # along with the civici: it would point at files not on R2. The
          # runner discards it and the next run archives that release again.
          git add data/ ':!data/stradario'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ANNCSU data"
          git push

      - name: Upload data to Cloudflare R2
        if: steps.changes.outputs.changed == 'true'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACL: private
          # The token cannot create buckets; stop rclone from trying to when it
          # uploads a new object (the _debug log never reached R2 because of it).
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          # Upload single files (overwrite if changed)
          rclone copy data/anncsu-indirizzi.parquet r2:anncsu-data/ -P
          rclone copy data/anncsu-indirizzi.pmtiles r2:anncsu-data/ -P
          rclone copy data/comuni.json r2:anncsu-data/ -P
          rclone copy data/comuni-h3.json r2:anncsu-data/ -P
          # Sync tiles directory (removes orphaned H3 cells)
          rclone sync data/tiles/ r2:anncsu-data/tiles/ --transfers=32 --checkers=32 -P
          # This month's release: the ZIP as downloaded and the raw Parquet,
          # into rilasci/<date>/. copy, never sync: the checkout holds only
          # this month's files, a sync would delete every earlier release.
          rclone copy data/rilasci/ r2:anncsu-data/rilasci/ \
            --include "*/*.zip" --include "*/*.parquet" -P

  # The catalog is built whenever the civici part succeeded, whatever happened
  # to the stradario. It runs in this workflow instead of on a workflow_run
  # trigger, so a green run does not build the catalog twice.
  catalog:
    needs: update-data
    permissions:
      contents: write
    uses: ./.github/workflows/build-catalog.yml
    with:
      force_upload: false
    secrets: inherit

  # Turns the run red after the catalog if the stradario step failed, so the
  # failure is never silent and never holds back the civici catalog.
  report:
    needs: [update-data, catalog]
    if: always() && needs.update-data.outputs.stradario == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The stradario step failed. Read the update-data job log for the error."
          exit 1
